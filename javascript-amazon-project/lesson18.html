<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // using callback function
      /*
        const xhr = new XMLHttpRequest();
        xhr.addEventListener("load", () => {
          console.log(xhr.response);
        });
        xhr.open("GET", "https://supersimplebackend.dev/greeting");
      xhr.send();
      */

      // using fetch and .then
      /*
        fetch("https://supersimplebackend.dev/greeting")
          .then((response) => {
            return response.text();
          })
          .then((data) => {
            console.log(data);
          });
          */

      // using fetch and async/await
      async function fetchGreeting() {
        const response = await fetch("https://supersimplebackend.dev/greeting");
        const data = await response.text();
        console.log(data);
      }
      // fetchGreeting();

      async function sendGreeting() {
        const response = await fetch(
          "https://supersimplebackend.dev/greeting",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name: "Karen",
            }),
          },
        );
        const text = await response.text();
        console.log(text);
      }
      sendGreeting();

      //attempting to make a GET request to amazon endpoint
      async function fetchAmazon() {
        try {
          const response = await fetch("https://amazon.com");
          const data = await response.text();
          console.log(data);
        } catch (error) {
          console.error("CORS error. your request was blocked by the backend");
        }
      }
      fetchAmazon();

      async function sendEmptyPost() {
        try {
          const response = await fetch(
            "https://supersimplebackend.dev/greeting",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({}),
            },
          );
          if (response.status >= 400) {
            throw response;
          }
          const text = await response.text();
          console.log(text);
        } catch (error) {
          if (error.status === 400) {
            console.log(await error.json());
          } else {
            console.log("Network error. Please try again later.");
          }
        }
      }
      sendEmptyPost();
    </script>
  </body>
</html>
