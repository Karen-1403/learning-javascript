<!doctype html>
<html>
  <head>
    <title>Cart quantity</title>
  </head>
  <body>
    <p>Cart quantity</p>
    <button onclick="displayCartQuantity()">Show Quantity</button>
    <button onclick="updateCartQuantity(1)">Add to cart</button>
    <button onclick="updateCartQuantity(2)">+2</button>
    <button onclick="updateCartQuantity(3)">+3</button>
    <button
      onclick="
        cartQuantity = 0;
        displayCartQuantity();
      "
    >
      Reset cart
    </button>
    <button onclick="updateCartQuantity(-1)">Remove from cart</button>
    <button onclick="updateCartQuantity(-2)">-2</button>
    <button onclick="updateCartQuantity(-3)">-3</button>
    <p class="js-cart-quantity"></p>
    <script>
      let cartQuantity = 0;
      displayCartQuantity();
      function updateCartQuantity(amount) {
        if (cartQuantity + amount > 10) {
          alert("Cart is full");
          return;
        } else if (cartQuantity + amount < 0) {
          alert("Not enough items in cart");
          return;
        } else {
          cartQuantity += amount;
        }
        displayCartQuantity();
      }
      function displayCartQuantity() {
        document.querySelector(".js-cart-quantity").innerText =
          `Cart quantity: ${cartQuantity}`;
      }
    </script>
  </body>
</html>
