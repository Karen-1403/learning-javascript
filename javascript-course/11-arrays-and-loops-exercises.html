<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function wordCount(arr) {
        const words = {};
        for (let i = 0; i < arr.length; i++) {
          let str = arr[i];

          if (words[str] == undefined) words[str] = 1;
          else words[str]++;
        }
        return words;
      }

      function findWord(arr, word) {
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] === word) {
            return i;
          }
        }
        return -1;
      }
      console.log(findWord(["a", "b", "c"], "b"));

      function removeEgg(arr) {
        const result = [];
        let count = 0;
        for (let i = arr.length - 1; i >= 0; i--) {
          if (arr[i] === "egg" && count < 2) {
            count++;
            result.unshift(arr[i]);
          } else {
            result.push(arr[i]);
          }
        }
        result.splice(0, 2);
        result.reverse();
        return result;
      }
      console.log(removeEgg(["egg", "bacon", "egg", "spam", "sausage", "egg"]));
      function fizzBuzz() {
        for (let i = 1; i <= 20; i++) {
          if (i % 3 === 0 && i % 5 === 0) {
            console.log("FizzBuzz");
          } else if (i % 3 === 0) {
            console.log("Fizz");
          } else if (i % 5 === 0) {
            console.log("Buzz");
          } else {
            console.log(i);
          }
        }
      }
      fizzBuzz();
      function noDuplicates(arr) {
        const result = [];
        for (let i = 0; i < arr.length; i++) {
          if (findWord(result, arr[i]) == -1) {
            result.push(arr[i]);
          }
        }
        return result;
      }
      console.log(noDuplicates(["red", "green", "green", "red"]));
    </script>
  </body>
</html>
