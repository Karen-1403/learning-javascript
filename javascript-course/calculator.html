<!doctype html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/calculator.css" />
  </head>
  <body>
    <p class="js-result result"></p>
    <button class="btn" onclick="updtateCalculation('1')">1</button>
    <button class="btn" onclick="updtateCalculation('2')">2</button>
    <button class="btn" onclick="updtateCalculation('3')">3</button>
    <button class="btn orange-btn" onclick="updtateCalculation('+')">+</button>

    <p></p>
    <button class="btn" onclick="updtateCalculation('4')">4</button>
    <button class="btn" onclick="updtateCalculation('5')">5</button>
    <button class="btn" onclick="updtateCalculation('6')">6</button>
    <button class="btn orange-btn" onclick="updtateCalculation('-')">-</button>
    <p></p>
    <button class="btn" onclick="updtateCalculation('7')">7</button>
    <button class="btn" onclick="updtateCalculation('8')">8</button>
    <button class="btn" onclick="updtateCalculation('9')">9</button>
    <button class="btn orange-btn" onclick="updtateCalculation('*')">*</button>
    <p></p>
    <button class="btn" onclick="updtateCalculation('0')">0</button>
    <button class="btn" onclick="updtateCalculation('.')">.</button>
    <button class="btn" onclick="updtateCalculation('=')">=</button>
    <button class="btn orange-btn" onclick="updtateCalculation('/')">/</button>
    <p></p>
    <button class="btn clear" onclick="updtateCalculation('')">Clear</button>
    <script>
      let calculation = localStorage.getItem("calculation") || "";
      if (localStorage.getItem("calculation")) {
        displayCalculation();
      }
      function updtateCalculation(value) {
        if (value === "=") {
          calculation = eval(calculation);
        } else if (value === "") {
          calculation = "";
        } else {
          calculation += value;
        }
        saveCalculation();
        displayCalculation();
      }
      function saveCalculation() {
        localStorage.setItem("calculation", calculation);
      }
      function displayCalculation() {
        document.querySelector(".js-result").innerText = calculation;
      }
    </script>
  </body>
</html>
