<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
  </head>
  <body>
    <button onclick="start()" class="start-btn">Start</button>
    <div>
      <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
      <p class="add-to-cart-message"></p>
    </div>
    <button onclick="add()">Add</button>
    <button onclick="remove()">Remove</button>
    <script>
      function start() {
        const button = document.querySelector(".start-btn");
        button.innerText = "Loading...";
        setTimeout(function () {
          button.innerText = "Finished!";
        }, 1000);
      }
      let timeoutId;
      function addToCart() {
        const message = document.querySelector(".add-to-cart-message");
        message.innerHTML = "Added";
        clearTimeout(timeoutId);
        timeoutId = setTimeout(function () {
          message.innerHTML = "";
        }, 2000);
      }
      let messages = 2;
      /*setInterval(function () {
        if (document.title === "App")
          document.title = `(${messages}) New messages`;
        else document.title = "App";
      }, 1000);*/

      function add() {
        messages++;
      }
      function remove() {
        messages--;
      }

      const multiply = (a, b) => a * b;
      console.log(multiply(2, 3));

      const countPositive = (arr) => {
        let count = 0;
        arr.forEach((num) => {
          num > 0 ? count++ : null;
        });
        return count;
      };
      console.log(countPositive([-1, 0, 1, 2, 3]));

      const addNum = (arr) => arr.map((num) => num + 1);
      console.log(addNum([1, 2, 3]));

      const removeEgg = (arr) => {
        let count = 0;
        const returnArr = arr.filter((item) => {
          if (item !== "egg") {
            return true;
          } else {
            count++;
            if (count > 2) {
              return true;
            }
          }
        });
        console.log(arr);
        return returnArr;
      };

      console.log(removeEgg(["egg", "milk", "egg", "egg", "flour"]));
    </script>
  </body>
</html>
